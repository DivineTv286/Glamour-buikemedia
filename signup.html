<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glamour | Join the Elite</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Combined Serif for headings and Sans for UI -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-gold: #c5a059;
            --dark-gold: #a68549;
            --rich-black: #0a0a0a;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--rich-black);
            color: #fff;
            overflow-x: hidden;
        }

        /* Split Screen Layout */
        .page-wrapper {
            display: flex;
            min-height: 100vh;
        }

        /* Brand Side (Visible on Desktop) */
        .brand-side {
            flex: 1.2;
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), 
                        url('https://images.unsplash.com/photo-1509631179647-0177331693ae?auto=format&fit=crop&q=80&w=1976');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 60px;
            position: relative;
        }

        .brand-side::after {
            content: "GLAMOUR";
            position: absolute;
            bottom: 20px;
            left: -20px;
            font-size: 10rem;
            font-weight: 900;
            opacity: 0.05;
            letter-spacing: 20px;
        }

        /* Form Side */
        .form-side {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 40px 8%;
            justify-content: center;
            background-color: var(--rich-black);
            z-index: 10;
        }

        .navbar-minimal {
            position: absolute;
            top: 40px;
            right: 8%;
            display: flex;
            gap: 20px;
        }

        .login-nav-link {
            color: #888;
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .login-nav-link:hover { color: var(--primary-gold); }

        .form-header { margin-bottom: 40px; }

        .main-title {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            margin-bottom: 10px;
            font-style: italic;
        }

        .subtitle {
            color: #666;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .signup-form {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .input-wrapper { display: flex; flex-direction: column; gap: 8px; }

        .input-label {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--primary-gold);
            letter-spacing: 1.5px;
        }

        .input-group {
            display: flex;
            align-items: center;
            background-color: var(--glass);
            border-bottom: 1px solid var(--border);
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .input-group:focus-within {
            border-bottom-color: var(--primary-gold);
            background-color: rgba(255, 255, 255, 0.07);
        }

        .input-icon {
            padding: 15px 0 15px 15px;
            color: #444;
            font-size: 0.9rem;
        }

        .input-group input {
            flex-grow: 1;
            padding: 18px;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 0.95rem;
        }

        .gold-submit-btn {
            margin-top: 20px;
            background: linear-gradient(135deg, var(--primary-gold), var(--dark-gold));
            color: #000;
            border: none;
            padding: 20px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            justify-content: center;
            gap: 15px;
            align-items: center;
        }

        .gold-submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(197, 160, 89, 0.2);
        }

        .form-footer {
            margin-top: 30px;
            font-size: 0.8rem;
            color: #444;
            text-align: center;
            line-height: 1.6;
        }

        .legal-link { color: #888; text-decoration: none; border-bottom: 1px solid #333; }

        /* Responsive */
        @media (max-width: 900px) {
            .brand-side { display: none; }
            .form-side { padding: 80px 10%; }
            .main-title { font-size: 2.8rem; }
        }
    </style>
</head>
<body>

    <div class="page-wrapper">
        <!-- Visual/Brand Side -->
        <section class="brand-side">
            <div class="logo-area">
                <span style="font-size: 2rem; color: var(--primary-gold);">❀</span>
            </div>
            <div class="brand-quote">
                <h2 style="font-family: 'Playfair Display'; font-size: 2rem; line-height: 1.2;">
                    "Elegance is not being noticed, <br>but being remembered."
                </h2>
            </div>
        </section>

        <!-- Functional Side -->
        <main class="form-side">
            <nav class="navbar-minimal">
                <a href="login.html" class="login-nav-link">ALREADY A MEMBER? <span style="color: #fff; font-weight: 700;">LOG IN</span></a>
            </nav>

            <header class="form-header">
                <h1 class="main-title">Sign Up</h1>
                <p class="subtitle">Enter the world of Glamour.</p>
            </header>

            <form class="signup-form" id="signupForm">
                <div class="input-wrapper">
                    <label class="input-label">IDENTITY</label>
                    <div class="input-group">
                        <span class="input-icon"><i class="fa-regular fa-user"></i></span>
                        <input type="text" id="full-name" placeholder="Full Name" required>
                    </div>
                </div>

                <div class="input-wrapper">
                    <label class="input-label">HANDLE</label>
                    <div class="input-group">
                        <span class="input-icon"><i class="fa-solid fa-at"></i></span>
                        <input type="text" id="username" placeholder="username" required>
                    </div>
                </div>

                <div class="input-wrapper">
                    <label class="input-label">COMMUNICATION</label>
                    <div class="input-group">
                        <span class="input-icon"><i class="fa-regular fa-envelope"></i></span>
                        <input type="email" id="email" placeholder="email@domain.com" required>
                    </div>
                </div>

                <div class="input-wrapper">
                    <label class="input-label">SECURITY</label>
                    <div class="input-group">
                        <span class="input-icon"><i class="fa-solid fa-shield-halved"></i></span>
                        <input type="password" id="password" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="gold-submit-btn">
                    Create Profile
                    <i class="fa-solid fa-arrow-right-long"></i>
                </button>
            </form>

            <footer class="form-footer">
                <p>By joining, you accept our <a href="#" class="legal-link">Membership Terms</a> <br> & <a href="#" class="legal-link">Privacy Policy</a>.</p>
            </footer>
        </main>
    </div>

    <script>
        document.getElementById('signupForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const name = document.getElementById('full-name').value;
            
            localStorage.setItem('glamour_username', user);
            localStorage.setItem('glamour_fullname', name);
            
            // Visual feedback before redirect
            const btn = e.target.querySelector('button');
            btn.innerHTML = "Processing...";
            btn.style.opacity = "0.7";
            
            setTimeout(() => {
                window.location.href = "dashboard.html";
            }, 800);
        });
    </script>
</body>
</html>
