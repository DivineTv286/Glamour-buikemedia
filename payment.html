<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Checkout | Glamour </title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-gold: #f3c642;
            --deep-black: #050505;
            --card-bg: #111111;
            --accent-glow: rgba(243, 198, 66, 0.1);
            --danger-red: #ff3b3b;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--deep-black);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(243, 198, 66, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(243, 198, 66, 0.05) 0%, transparent 40%);
            color: #ffffff;
            margin: 0;
            min-height: 100vh;
        }

        .wrapper { padding: 25px; max-width: 480px; margin: 0 auto; }

        /* Header Styles */
        .brand-header { text-align: center; margin-bottom: 30px; }
        .secure-tag {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 6px 16px;
            border-radius: 100px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--primary-gold);
        }

        /* Countdown Timer */
        .timer-box {
            background: #1a1a1a;
            border-radius: 16px;
            padding: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin: 25px 0;
            border: 1px solid #222;
        }
        #countdown { color: var(--danger-red); font-weight: 800; font-family: monospace; font-size: 18px; }

        /* Main Payment Card */
        .payment-card {
            background: var(--card-bg);
            border-radius: 32px;
            border: 1px solid #222;
            padding: 35px 25px;
            box-shadow: 0 40px 80px rgba(0,0,0,0.6);
            position: relative;
            overflow: hidden;
        }

        .payment-card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; height: 4px;
            background: linear-gradient(90deg, transparent, var(--primary-gold), transparent);
        }

        /* Value Displays */
        .price-section { text-align: center; margin-bottom: 35px; }
        .amount-container {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(243, 198, 66, 0.08);
            padding: 10px 20px;
            border-radius: 20px;
            margin-top: 10px;
            border: 1px dashed rgba(243, 198, 66, 0.3);
        }
        .price-text { font-size: 38px; font-weight: 800; color: #fff; }

        .info-grid { display: flex; flex-direction: column; gap: 24px; }
        .info-label { font-size: 11px; font-weight: 700; color: #666; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; display: block; }
        .info-value { font-size: 17px; font-weight: 600; color: #eee; display: flex; justify-content: space-between; align-items: center; }

        /* Copy Button Styles */
        .copy-btn {
            background: var(--primary-gold);
            color: #000;
            border: none;
            padding: 6px 14px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 800;
            transition: 0.2s;
            cursor: pointer;
        }
        .copy-btn:active { transform: scale(0.92); }
        .copy-btn i { margin-right: 4px; }

        .acc-number { font-size: 24px; font-weight: 800; letter-spacing: 1px; color: var(--primary-gold); }

        /* Action Button */
        .tg-button {
            background: #24A1DE;
            color: #fff;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 22px;
            border-radius: 20px;
            font-weight: 800;
            margin-top: 25px;
            transition: 0.3s;
            box-shadow: 0 10px 20px rgba(36, 161, 222, 0.2);
        }
        .tg-button:hover { background: #2eb2f0; color: white; transform: translateY(-2px); }

        /* Warning Banner */
        .warning-banner {
            background: rgba(255, 59, 59, 0.1);
            color: var(--danger-red);
            padding: 12px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: 700;
            text-align: center;
            border: 1px solid rgba(255, 59, 59, 0.2);
            margin-bottom: 25px;
        }

        /* Live Notification */
        #live-toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-150%);
            background: #1a1a1a; border: 1px solid #333; padding: 12px 24px;
            border-radius: 50px; z-index: 9999; transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            white-space: nowrap; box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        #live-toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

<div id="live-toast">
    <small><i class="fa fa-circle" style="color: #4CAF50; font-size: 8px; margin-right: 8px;"></i> <span id="user-name"></span> completed activation</small>
</div>

<div class="wrapper">
    <div class="brand-header">
        <span class="secure-tag"><i class="fa fa-lock"></i> SECURE ENCRYPTED NODE</span>
        <h2 style="font-weight: 800; margin-top: 15px;">Finalize Payment</h2>
    </div>

    <div class="warning-banner">
        <i class="fa fa-exclamation-triangle"></i> DO NOT USE OPAY FOR THIS TRANSFER
    </div>

    <div class="payment-card">
        <div class="price-section">
            <span class="info-label">Amount to Send</span>
            <div class="amount-container">
                <span class="price-text">₦14,500</span>
                <button class="copy-btn" onclick="copyAction('14500', 'Amount')"><i class="fa fa-copy"></i> COPY</button>
            </div>
        </div>

        <div class="info-grid">
            <div class="info-item">
                <span class="info-label">Receiving Bank</span>
                <div class="info-value">Moniepoint MFB</div>
            </div>

            <div class="info-item">
                <span class="info-label">Account Number</span>
                <div class="info-value">
                    <span class="acc-number">5783684484</span>
                    <button class="copy-btn" onclick="copyAction('5783684484', 'Account Number')"><i class="fa fa-copy"></i> COPY</button>
                </div>
            </div>

            <div class="info-item">
                <span class="info-label">Beneficiary</span>
                <div class="info-value" style="color: var(--primary-gold);">
                    CHIBUIKEM P. UGWUANYI  <i class="fa fa-check-circle"></i>
                </div>
            </div>
        </div>
    </div>

    <div class="timer-box">
        <span style="font-size: 11px; font-weight: 700; color: #777;">SESSION EXPIRES IN:</span>
        <span id="countdown">10:00</span>
    </div>
<a href="#" id="tg-confirm-btn" class="tg-button">
    <i class="fa-brands fa-telegram"></i> CONFIRM PAYMENT
</a>


    <p style="text-align: center; font-size: 11px; color: #444; margin-top: 30px; letter-spacing: 0.5px;">
        <i class="fa fa-shield-halved"></i> PCI-DSS COMPLIANT | ENCRYPTED TRANSACTION
    </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
    // Universal Copy Function
function copyAction(text, label) {
    const input = document.createElement('textarea');
    input.value = text;
    document.body.appendChild(input);
    input.select();
    input.setSelectionRange(0, 99999);
    
    try {
        document.execCommand('copy');
        const Toast = Swal.mixin({
            toast: true,
            position: 'top',
            showConfirmButton: false,
            timer: 2000,
            background: '#222',
            color: '#fff'
        });
        Toast.fire({
            icon: 'success',
            title: `${label} copied to clipboard`
        });
    } catch (err) {
        console.error('Copy failed');
    }
    document.body.removeChild(input);
}

// Modern Countdown
let time = 600;
setInterval(() => {
    const mins = Math.floor(time / 60);
    const secs = time % 60;
    document.getElementById('countdown').innerHTML = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    if(time > 0) time--;
}, 1000);

// Dynamic Live Notifications
const users = ["Uche K.", "Tobi A.", "Blessing E.", "Musa W.", "Amaka O.", "David S."];
function triggerToast() {
    const toast = document.getElementById('live-toast');
    const user = users[Math.floor(Math.random() * users.length)];
    document.getElementById('user-name').innerText = user;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 4000);
}
setInterval(triggerToast, 12000);
setTimeout(triggerToast, 2000);

// Initial Warning Pop-up
window.onload = () => {
    setTimeout(() => {
        Swal.fire({
            title: '⚠️ PAYMENT NOTICE:',
            html: `<div style="text-align: left; font-size: 15px; line-height: 1.5;">
                Please avoid using OPAY for this transaction, as it may delay confirmation and affect withdrawals. 
                STREAM supports Palmpay, Moniepoint, POS transfers, and all major banks except OPAY.
            </div>`,
            confirmButtonText: 'Understood',
            confirmButtonColor: '#ff3b3b', 
            background: '#ffffff',
            color: '#000000',
            allowOutsideClick: false
        });
    }, 600);
};

// Function to build the Telegram Message
function updateTelegramLink(username) {
    const amount = "₦14,500";
    const country = "Nigeria";
    const narration = `${username}_GLAM`; // Auto-appends _GLAM
    
    const message = `Hello Admin, I have just made a payment for my Glamour account activation.

👤 Username: ${username}
💰 Amount: ${amount}
🌍 Country: ${country}
📝 Narration: ${narration}

Please verify and activate my account.`;

    const encodedMessage = encodeURIComponent(message);
    const tgLink = `https://t.me/glamourrcoach?text=${encodedMessage}`;
    
    // Updates the button link
    const btn = document.getElementById('tg-confirm-btn');
    if(btn) btn.href = tgLink;
}

// Logic to grab the username from Sign-up memory
window.addEventListener('DOMContentLoaded', (event) => {
    // Looks for the key 'glamour_username' saved in signup.html
    const registeredName = localStorage.getItem('glamour_username') || 'Guest';
    
    updateTelegramLink(registeredName); 
});
</script>

</body>
</html>
