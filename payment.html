<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Checkout | Glamour</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --glam-gold: #dbb445;
            --glam-dark: #000000;
            --glam-card: #0a0a0a;
            --glam-accent: rgba(219, 180, 69, 0.15);
            --text-muted: #71717a;
            --glam-danger: #ff4d4d;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--glam-dark);
            background-image: radial-gradient(circle at 50% -20%, #1a160a 0%, #000000 70%);
            color: #ffffff;
            margin: 0;
            overflow-x: hidden;
        }

        .wrapper { padding: 20px; max-width: 450px; margin: 0 auto; min-height: 100vh; }

        /* --- HEADER & TIMER --- */
        .header-box { text-align: center; margin: 40px 0 30px; }
        .secure-badge {
            background: var(--glam-accent);
            color: var(--glam-gold);
            font-size: 10px;
            font-weight: 900;
            padding: 6px 14px;
            border-radius: 50px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            border: 1px solid rgba(219, 180, 69, 0.2);
        }
        .main-title { font-size: 26px; font-weight: 900; margin-top: 15px; letter-spacing: -1px; }
        
        .timer-pill {
            background: #111;
            border: 1px solid #222;
            padding: 8px 18px;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
        }
        #countdown { font-weight: 800; color: var(--glam-danger); font-family: monospace; font-size: 16px; }

        /* --- BANKING CARD --- */
        .payment-card {
            background: var(--glam-card);
            border: 1px solid #1a1a1a;
            border-radius: 28px;
            padding: 30px;
            margin-bottom: 25px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
            position: relative;
        }

        /* Red Warning Ribbon */
        .opay-warning-ribbon {
            background: rgba(255, 77, 77, 0.1);
            border: 1px solid var(--glam-danger);
            color: var(--glam-danger);
            font-size: 11px;
            font-weight: 800;
            text-align: center;
            padding: 8px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .payment-card::after {
            content: ''; position: absolute; inset: 0; border-radius: 28px;
            padding: 1px; background: linear-gradient(135deg, rgba(219,180,69,0.3), transparent, rgba(255,255,255,0.05));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor; mask-composite: exclude;
        }

        .price-display { text-align: center; padding-bottom: 25px; border-bottom: 1px solid #1a1a1a; margin-bottom: 25px; }
        .price-label { font-size: 11px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; }
        .price-value { font-size: 42px; font-weight: 900; color: var(--glam-gold); }

        .bank-details { display: grid; gap: 20px; }
        .detail-item { position: relative; }
        .detail-label { font-size: 10px; color: var(--text-muted); font-weight: 800; text-transform: uppercase; margin-bottom: 6px; display: block; }
        .detail-value { font-size: 16px; font-weight: 700; color: #fff; display: flex; align-items: center; justify-content: space-between; }
        
        .acc-number { font-size: 22px; font-weight: 800; color: #fff; font-family: 'Inter', sans-serif; }
        
        .mini-copy {
            background: #1a1a1a; border: none; color: var(--glam-gold);
            padding: 8px 12px; border-radius: 10px; font-size: 12px; font-weight: 700;
            transition: 0.2s;
        }
        .mini-copy:active { transform: scale(0.9); }

        /* --- BUTTONS --- */
        .btn-submit {
            background: #0088cc; color: #fff; text-decoration: none;
            display: flex; align-items: center; justify-content: center; gap: 12px;
            width: 100%; padding: 20px; border-radius: 20px;
            font-weight: 900; font-size: 15px; margin-bottom: 20px;
            transition: 0.3s; border: none;
        }
        .btn-submit:hover { background: #0099e6; transform: translateY(-3px); color: #fff; }

        .security-footer {
            text-align: center; padding: 20px; border-radius: 20px;
            background: rgba(255,255,255,0.02); border: 1px dashed #222;
        }
        .security-footer span { font-size: 12px; color: var(--text-muted); display: block; margin-top: 8px; }

        /* --- NOTIFICATION --- */
        #live-notif {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-150%);
            background: rgba(15, 15, 15, 0.9); border: 1px solid #222;
            backdrop-filter: blur(10px); padding: 12px 20px; border-radius: 15px;
            z-index: 1000; width: 90%; max-width: 380px; transition: 0.5s;
        }
        #live-notif.active { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

<div id="live-notif">
    <div style="display: flex; align-items: center; gap: 12px;">
        <div style="width: 10px; height: 10px; background: #4bb543; border-radius: 50%; box-shadow: 0 0 10px #4bb543;"></div>
        <span id="notif-content" style="font-size: 12px; font-weight: 600;"></span>
    </div>
</div>

<div class="wrapper">
    <div class="header-box">
        <span class="secure-badge"><i class="fa fa-shield"></i> Pci-Dss Compliant</span>
        <h1 class="main-title">Finalize Activation</h1>
        
        <div class="timer-pill">
            <span style="font-size: 12px; color: var(--text-muted); font-weight: 700;">REQUEST EXPIRES:</span>
            <span id="countdown">10:00</span>
        </div>
    </div>

    <div class="payment-card">
        <div class="opay-warning-ribbon">
            <i class="fa fa-triangle-exclamation"></i> DO NOT PAY USING OPAY APP
        </div>

        <div class="price-display">
            <span class="price-label">Amount Due</span>
            <div class="price-value">₦14,000</div>
        </div>

        <div class="bank-details">
            <div class="detail-item">
                <span class="detail-label">Bank Name</span>
                <div class="detail-value">Moniepoint Microfinance Bank</div>
            </div>

            <div class="detail-item">
                <span class="detail-label">Account Number</span>
                <div class="detail-value">
    <span class="acc-number" id="accNum">7073734725</span>
    <input type="text" value="7073734725" id="hiddenAcc" style="position: absolute; left: -9999px;">
    <button class="mini-copy" onclick="copyAccount()">COPY</button>
</div>
            </div>

            <div class="detail-item">
                <span class="detail-label">Beneficiary Name</span>
                <div class="detail-value" style="color: var(--glam-gold);">
                    CHINAZA A. REJOICE <i class="fa fa-check-circle"></i>
                </div>
            </div>
        </div>
    </div>

    <a href="https://t.me/Coachnancy5?text=I%20have%20made%20payment%20for%20Glam-Premium" class="btn-submit">
        <i class="fa-brands fa-telegram"></i> CONFIRM PAYMENT ON TELEGRAM
    </a>

    <div class="security-footer">
        <span><i class="fa fa-lock"></i> Your transaction is encrypted and recorded.</span>
    </div>
</div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
    function copyAccount() {
        const val = "7073734725";
        const hiddenInput = document.getElementById('hiddenAcc');
        
        // Success handler
        const success = () => {
            const Toast = Swal.mixin({
                toast: true,
                position: 'top',
                showConfirmButton: false,
                timer: 1500,
                background: '#111',
                color: '#fff'
            });
            Toast.fire({ icon: 'success', title: 'Account Number Copied' });
        };

        // Method 1: Modern Clipboard API
        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(val).then(success).catch(() => method2());
        } else {
            method2();
        }

        // Method 2: Traditional ExecCommand
        function method2() {
            hiddenInput.select();
            hiddenInput.setSelectionRange(0, 99999); // For mobile
            try {
                const result = document.execCommand('copy');
                if (result) success();
                else method3();
            } catch (err) {
                method3();
            }
        }

        // Method 3: The "Nuclear" Option (Manual Prompt)
        function method3() {
            window.prompt("Copy the account number below:", val);
        }
    }

    // --- REMAINDER OF YOUR CODE ---

    window.onload = function() {
        setTimeout(() => {
            Swal.fire({
                title: 'IMPORTANT NOTICE!',
                text: 'Please DO NOT make payments using OPAY. Use other banks to ensure your activation is instant.',
                icon: 'warning',
                confirmButtonColor: '#dbb445',
                confirmButtonText: 'I UNDERSTAND',
                background: '#0a0a0a',
                color: '#fff',
                backdrop: `rgba(0,0,0,0.9)`
            });
        }, 500);
    };

    let time = 600;
    const timerEl = document.getElementById('countdown');
    setInterval(() => {
        let mins = Math.floor(time / 60);
        let secs = time % 60;
        timerEl.innerHTML = `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
        if(time > 0) time--;
    }, 1000);

    const names = ["Emeka V.", "Adebayo R.", "Sarah J.", "Ibrahim U.", "Gift N.", "Chioma A."];
    const notif = document.getElementById('live-notif');
    const content = document.getElementById('notif-content');

    function triggerNotif() {
        const name = names[Math.floor(Math.random() * names.length)];
        content.innerHTML = `<span style="color:var(--glam-gold)">${name}</span> just completed activation`;
        notif.classList.add('active');
        setTimeout(() => notif.classList.remove('active'), 4000);
    }
    setInterval(triggerNotif, 9000);
    setTimeout(triggerNotif, 3000); 
</script>
</body>
</html>
