<!DOCTYPE html>
<html lang="en">
<head>
     <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="apple-touch-icon" href="assets/favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Checkout | Glamour</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-gold: #dbb445;
            --deep-black: #050505;
            --card-bg: #0d0d0d;
            --border-color: #1a1a1a;
            --danger-red: #ff3b3b;
            --text-muted: #666;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--deep-black);
            color: #ffffff;
            margin: 0;
            min-height: 100vh;
        }

        .wrapper { padding: 25px; max-width: 450px; margin: 0 auto; }

        .brand-header { text-align: center; margin: 20px 0 25px; }
        .secure-tag {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border-color);
            padding: 6px 16px;
            border-radius: 100px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--primary-gold);
            text-transform: uppercase;
        }

        .warning-banner {
            background: rgba(255, 59, 59, 0.08);
            color: var(--danger-red);
            padding: 14px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 700;
            text-align: center;
            border: 1px solid rgba(255, 59, 59, 0.15);
            margin-bottom: 20px;
        }

        .payment-card {
            background: var(--card-bg);
            border-radius: 24px;
            border: 1px solid var(--border-color);
            padding: 30px 24px;
            position: relative;
        }

        .price-section { text-align: center; margin-bottom: 30px; }
        .amount-container {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: rgba(219, 180, 69, 0.05);
            padding: 10px 18px;
            border-radius: 16px;
            margin-top: 8px;
            border: 1px dashed rgba(219, 180, 69, 0.25);
        }
        .price-text { font-size: 34px; font-weight: 800; color: #fff; letter-spacing: -0.5px; }

        .info-grid { display: flex; flex-direction: column; gap: 20px; }
        .info-label { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; display: block; }
        .info-value { font-size: 16px; font-weight: 600; color: #eee; display: flex; justify-content: space-between; align-items: center; }

        .copy-btn {
            background: var(--primary-gold);
            color: #000;
            border: none;
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 800;
            transition: transform 0.2s;
            cursor: pointer;
        }
        .copy-btn:active { transform: scale(0.95); }

        .acc-number { font-size: 22px; font-weight: 800; letter-spacing: 0.5px; color: var(--primary-gold); }

        .timer-box {
            background: #0a0a0a;
            border-radius: 14px;
            padding: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin: 20px 0;
            border: 1px solid var(--border-color);
        }
        #countdown { color: var(--danger-red); font-weight: 700; font-family: monospace; font-size: 16px; }

        .tg-button {
            background: #24A1DE;
            color: #fff;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 18px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 15px;
            text-transform: uppercase;
            transition: 0.2s ease;
        }
        .tg-button:hover { background: #2eb2f0; color: white; }

        #live-toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-150%);
            background: #0a0a0a; border: 1px solid var(--border-color); padding: 10px 20px;
            border-radius: 50px; z-index: 9999; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #live-toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

<div id="live-toast">
    <small><i class="fa fa-circle" style="color: #4CAF50; font-size: 7px; margin-right: 6px;"></i> <span id="user-name" style="font-weight:700;"></span> completed activation</small>
</div>

<div class="wrapper">
    <div class="brand-header">
        <span class="secure-tag"><i class="fa fa-lock"></i> Secure Gateway</span>
        <h3 style="font-weight: 800; margin-top: 15px; font-size: 22px;">Finalize Transfer</h3>
    </div>

    <div class="warning-banner">
        <i class="fa fa-exclamation-triangle"></i> ATTENTION: DO NOT USE OPAY FOR THIS TRANSFER
    </div>

    <div class="payment-card">
        <div class="price-section">
            <span class="info-label">Exact Amount to Send</span>
            <div class="amount-container">
                <span class="price-text" id="display-amount">₦14,500</span>
                <button class="copy-btn" id="copy-amount-btn"><i class="fa fa-copy"></i> COPY</button>
            </div>
        </div>

        <div class="info-grid">
            <div class="info-item">
                <span class="info-label">Receiving Bank</span>
                <div class="info-value">KUDA MFB</div>
            </div>

            <div class="info-item">
                <span class="info-label">Account Number</span>
                <div class="info-value">
                    <span class="acc-number" id="target-account">2078450723</span>
                    <button class="copy-btn" onclick="copyValue('2078450723', 'Account Number')"><i class="fa fa-copy"></i> COPY</button>
                </div>
            </div>

            <div class="info-item">
                <span class="info-label">Beneficiary Name</span>
                <div class="info-value" style="color: var(--primary-gold);">
                    CHIBUIKEM P. UGWUANYI <i class="fa fa-check-circle" style="font-size:14px;"></i>
                </div>
            </div>
        </div>
    </div>

    <div class="timer-box">
        <span style="font-size: 11px; font-weight: 600; color: #555; letter-spacing: 0.5px;">EXPIRES IN:</span>
        <span id="countdown">10:00</span>
    </div>

    <a href="#" id="tg-confirm-btn" class="tg-button">
        <i class="fa-brands fa-telegram" style="font-size:18px;"></i> Confirm Payment
    </a>

    <p style="text-align: center; font-size: 11px; color: #333; margin-top: 25px;">
        <i class="fa fa-shield-halved"></i> Secured Activation Node
    </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
// Universal Toast Notification
const triggerAlert = (msg) => {
    Swal.mixin({
        toast: true,
        position: 'top',
        showConfirmButton: false,
        timer: 2000,
        background: '#111',
        color: '#fff'
    }).fire({
        icon: 'success',
        title: msg
    });
};

// Clipboard System
function copyValue(text, label) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
            triggerAlert(`${label} copied to clipboard`);
        }).catch(() => fallbackCopy(text, label));
    } else {
        fallbackCopy(text, label);
    }
}

function fallbackCopy(text, label) {
    const el = document.createElement('textarea');
    el.value = text;
    document.body.appendChild(el);
    el.select();
    document.execCommand('copy');
    document.body.removeChild(el);
    triggerAlert(`${label} copied to clipboard`);
}

// Config Dynamic Plan Routing & Setup
let numericPrice = 14500;
let formattedPrice = "₦14,500";

document.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);
    const selectedPlan = params.get('plan');
    const username = localStorage.getItem('glamour_username') || 'Guest';

    if (selectedPlan === 'Max' || selectedPlan === 'prime') {
        numericPrice = 20000;
        formattedPrice = "₦20,000";
    }

    document.getElementById('display-amount').innerText = formattedPrice;
    
    document.getElementById('copy-amount-btn').onclick = () => {
        copyValue(numericPrice.toString(), 'Amount');
    };

    // Build optimized message body for Telegram validation node
    const message = `Hello Admin, I have just made a payment for my Glamour account activation.

👤 Username: ${username}
💰 Amount: ${formattedPrice}
🌍 Country: Nigeria
📝 Narration: ${username}_GLAM

Please verify and activate my account.`;

    const tgLink = `https://t.me/glamourrcoach?text=${encodeURIComponent(message)}`;
    const confirmBtn = document.getElementById('tg-confirm-btn');
    if (confirmBtn) confirmBtn.href = tgLink;
});

// Countdown System
let time = 600;
const timerInterval = setInterval(() => {
    const mins = Math.floor(time / 60);
    const secs = time % 60;
    document.getElementById('countdown').innerHTML = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    if (time > 0) time--;
    else clearInterval(timerInterval);
}, 1000);

// Dynamic Toast Notifications
const users = ["Uche K.", "Tobi A.", "Blessing E.", "Musa W.", "Amaka O.", "David S."];
function triggerToast() {
    const toast = document.getElementById('live-toast');
    const user = users[Math.floor(Math.random() * users.length)];
    document.getElementById('user-name').innerText = user;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 4000);
}
setInterval(triggerToast, 12000);
setTimeout(triggerToast, 1500);

// Modal Notice
window.onload = () => {
    setTimeout(() => {
        Swal.fire({
            title: 'PAYMENT NOTICE',
            html: `<div style="text-align: left; font-size: 14px; line-height: 1.6; color:#333;">
                Please avoid using <b>OPAY</b> for this transaction to bypass down-time delays. <br><br>
                Glamour supports Palmpay, Moniepoint, POS transfers, and all other major banks cleanly.
            </div>`,
            confirmButtonText: 'Understood',
            confirmButtonColor: '#dbb445', 
            background: '#ffffff',
            color: '#000000',
            allowOutsideClick: false
        });
    }, 500);
};
</script>

</body>
</html>
