<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activate Account | Glamour</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --glam-gold: #dbb445;
            --glam-dark: #000000;
            --glam-card: #0d0d0d;
            --text-muted: #888;
            --glam-cyan: #26D0CE;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--glam-dark);
            color: #ffffff;
            margin: 0;
            padding-bottom: 40px;
        }

        .wrapper { padding: 20px; max-width: 450px; margin: 0 auto; }

        .brand-header { text-align: center; margin: 30px 0 20px; }
        .confirm-title { 
            color: var(--glam-cyan); 
            font-weight: 900; 
            font-size: 1.1rem; 
            letter-spacing: 1px;
            margin-bottom: 5px;
        }
        .subtitle { font-size: 13px; color: var(--text-muted); font-weight: 500; }

        .details-card {
            background: #0a0a0a;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            border: 1px solid #1a1a1a;
        }
        .detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }
        .detail-row:last-child { margin-bottom: 0; }
        .detail-label { color: #666; font-size: 14px; font-weight: 600; }
        .detail-value { color: #fff; font-size: 14px; font-weight: 700; }

        .package-card {
            background: #000;
            border: 2px solid var(--glam-gold);
            border-radius: 25px;
            padding: 35px 25px;
            text-align: center;
            margin-bottom: 25px;
        }
        .plan-name { color: var(--glam-gold); font-size: 16px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }
        .plan-price { font-size: 44px; font-weight: 900; margin: 15px 0; }
        
        .benefit-list { text-align: left; margin: 25px 0; list-style: none; padding: 0; }
        .benefit-list li { 
            font-size: 14px; margin-bottom: 14px; display: flex; align-items: center; gap: 12px;
            color: #efefef;
        }
        .benefit-list li i { color: var(--glam-gold); font-size: 16px; }
        .benefit-list b { color: #fff; }

        .btn-pay {
            background: var(--glam-gold); color: #000; border: none;
            width: 100%; padding: 20px; border-radius: 18px;
            font-weight: 900; font-size: 15px; text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: 0.3s;
        }
        .btn-pay:active { transform: scale(0.97); }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="brand-header">
        <h2 class="confirm-title">CONFIRM DETAILS</h2>
        <p class="subtitle">Almost there! Review your details before activating your account.</p>
    </div>

    <div class="details-card">
        <div class="detail-row">
            <span class="detail-label">Name:</span>
            <span class="detail-value" id="display-fullname">Loading...</span>
        </div>
        <div class="detail-row">
            <span class="detail-label">Username:</span>
            <span class="detail-value" id="display-username">Loading...</span>
        </div>
        <div class="detail-row">
            <span class="detail-label">Selected Plan:</span>
            <span class="detail-value" id="display-selected-plan" style="color: var(--glam-gold);">Loading...</span>
        </div>
        <div class="detail-row">
            <span class="detail-label">Country:</span>
            <span class="detail-value">Nigeria</span>
        </div>
    </div>

    <div class="package-card">
        <span class="plan-name" id="plan-title">GLAM BASIC</span>
        <div class="plan-price" id="plan-cost">₦0</div>
        
        <ul class="benefit-list" id="plan-benefits">
            </ul>

        <a href="payment.html" style="text-decoration: none;">
            <button class="btn-pay">PAY & ACTIVATE NOW</button>
        </a>
    </div>
</div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
    const fullName = localStorage.getItem('glamour_fullname') || 'User Name';
    const userName = localStorage.getItem('glamour_username') || '@username';
    
    let rawPlan = localStorage.getItem('glamour_selected_plan') || 'GLAM PRIME';
    let cleanPlan = "GLAM BASIC"; // Default fallback
    
    if (rawPlan === "GLAM PRIME" || rawPlan === "basic" || rawPlan === "prime") {
        cleanPlan = "prime";
    }
    document.getElementById('display-fullname').innerText = fullName;
    document.getElementById('display-username').innerText = userName.startsWith('@') ? userName : '@' + userName;
    document.getElementById('display-selected-plan').innerText = rawPlan;
    
    const costElement = document.getElementById('plan-cost');
    const benefitsContainer = document.getElementById('plan-benefits');

    if (cleanPlan === "prime") {
        costElement.innerText = "₦20,000";
        benefitsContainer.innerHTML = `
            <li><i class="fa-solid fa-circle-check"></i> <span>Instant <b>₦20,000</b> Welcome Bonus</span></li>
            <li><i class="fa-solid fa-circle-check"></i> <span>Premium Tap & Earn Task Access</span></li>
            <li><i class="fa-solid fa-circle-check"></i> <span>Priority Withdrawal Approval</span></li>
            <li><i class="fa-solid fa-circle-check"></i> <span>Global Remote Gigs Access</span></li>
            <li><i class="fa-solid fa-circle-check"></i> <span>Total GlamGains: <b>₦24,000/Hr</b></span></li>
        `;
    } else {
        costElement.innerText = "₦14,500";
        benefitsContainer.innerHTML = `
            <li><i class="fa-solid fa-circle-check"></i> <span>Instant <b>₦10,000</b> Welcome Bonus</span></li>
            <li><i class="fa-solid fa-circle-check"></i> <span>Standard Tap & Earn Task Access</span></li>
            <li><i class="fa-solid fa-circle-check"></i> <span>Standard Withdrawal Window</span></li>
            <li><i class="fa-solid fa-circle-check"></i> <span>Community Support Hub Access</span></li>
            <li><i class="fa-solid fa-circle-check"></i> <span>Total GlamGains: <b>₦12,000/Hr</b></span></li>
        `;
    }
    const payButton = document.querySelector('.btn-pay');
    if (payButton) {
        payButton.addEventListener('click', (e) => {
            e.preventDefault(); 
            window.location.href = `plan-confirm.html?plan=${cleanPlan}`;
        });
    }
});
    </script>
</body>
</html>
